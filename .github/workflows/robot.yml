name: Robot Lignelife Quotidien

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  run-robot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Execution automatique du script
        run: |
          CHEMIN_FICHIER=$(find . -name "automatisation.py" -print -quit)
          python "$CHEMIN_FICHIER"
